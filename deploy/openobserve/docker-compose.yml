# Local OpenObserve for Rootwise traces, metrics and logs (OTLP/HTTP on :5080).
#   docker compose -f deploy/openobserve/docker-compose.yml up -d
# UI: http://localhost:5080  (log in with the root user below)
# Credentials come from deploy/openobserve/.env (OPENOBSERVE_USER, OPENOBSERVE_PASSWORD; 8+ chars with upper,
# lower, digit and symbol). Put the same values in backend/.env with OTEL_ENABLED=true.
# Pin `image` to a specific release tag for anything beyond local development.
services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: rootwise-openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"   # UI + HTTP API + OTLP/HTTP (/api/<org>/v1/{traces,logs,metrics})
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-root@rootwise.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-replace-me-in-local-env}
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data

volumes:
  openobserve-data:
